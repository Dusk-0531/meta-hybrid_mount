name: lints-check
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  checks: write
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lints-check:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build CI image
        run: docker build -f .github/docker/ci/Dockerfile -t meta-hybrid_mount-ci:local .
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Format codes
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$HOME/.cargo:/home/runner/.cargo" \
            -v "$HOME/.rustup:/home/runner/.rustup" \
            -e HOME=/home/runner \
            -e CARGO_HOME=/home/runner/.cargo \
            -e RUSTUP_HOME=/home/runner/.rustup \
            -w /repo \
            --user "$(id -u):$(id -g)" \
            meta-hybrid_mount-ci:local \
            cargo fmt --all -- --check
      - name: Clippy code
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$HOME/.cargo:/home/runner/.cargo" \
            -v "$HOME/.rustup:/home/runner/.rustup" \
            -e HOME=/home/runner \
            -e CARGO_HOME=/home/runner/.cargo \
            -e RUSTUP_HOME=/home/runner/.rustup \
            -w /repo \
            --user "$(id -u):$(id -g)" \
            meta-hybrid_mount-ci:local \
            cargo clippy --all-targets -- -D warnings
      - name: Run unit tests
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$HOME/.cargo:/home/runner/.cargo" \
            -v "$HOME/.rustup:/home/runner/.rustup" \
            -e HOME=/home/runner \
            -e CARGO_HOME=/home/runner/.cargo \
            -e RUSTUP_HOME=/home/runner/.rustup \
            -w /repo \
            --user "$(id -u):$(id -g)" \
            meta-hybrid_mount-ci:local \
            cargo test --all-targets --workspace

  webui-lints:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      PNPM_STORE_PATH: ${{ github.workspace }}/.pnpm-store
    steps:
      - uses: actions/checkout@v6
      - name: Prepare pnpm store
        run: mkdir -p "$PNPM_STORE_PATH"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('webui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Build CI image
        run: docker build -f .github/docker/ci/Dockerfile -t meta-hybrid_mount-ci:local .
      - name: Generate constants
        run: |
          cat <<'EOF' > webui/src/lib/constants_gen.ts
          export const APP_VERSION = "dev";
          export const IS_RELEASE = false;
          export const ENABLE_KASUMI = true;
          export const RUST_PATHS = {
            CONFIG: "/data/adb/hybrid-mount/config.toml",
            DAEMON_STATE: "/data/adb/hybrid-mount/run/daemon_state.json",
            BINARY: "/data/adb/modules/hybrid_mount/hybrid-mount",
          } as const;
          EOF
      - name: Install dependencies
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$PNPM_STORE_PATH:$PNPM_STORE_PATH" \
            -v "$HOME/.cargo:/home/runner/.cargo" \
            -v "$HOME/.rustup:/home/runner/.rustup" \
            -e PNPM_STORE_PATH="$PNPM_STORE_PATH" \
            -e HOME=/home/runner \
            -e CARGO_HOME=/home/runner/.cargo \
            -e RUSTUP_HOME=/home/runner/.rustup \
            -w /repo/webui \
            --user "$(id -u):$(id -g)" \
            meta-hybrid_mount-ci:local \
            pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_PATH"
      - name: Generate info tab data
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$PNPM_STORE_PATH:$PNPM_STORE_PATH" \
            -v "$HOME/.cargo:/home/runner/.cargo" \
            -v "$HOME/.rustup:/home/runner/.rustup" \
            -e PNPM_STORE_PATH="$PNPM_STORE_PATH" \
            -e HOME=/home/runner \
            -e CARGO_HOME=/home/runner/.cargo \
            -e RUSTUP_HOME=/home/runner/.rustup \
            -w /repo/webui \
            --user "$(id -u):$(id -g)" \
            meta-hybrid_mount-ci:local \
            pnpm generate:info-tab-data
      - name: Run lint
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$PNPM_STORE_PATH:$PNPM_STORE_PATH" \
            -v "$HOME/.cargo:/home/runner/.cargo" \
            -v "$HOME/.rustup:/home/runner/.rustup" \
            -e PNPM_STORE_PATH="$PNPM_STORE_PATH" \
            -e HOME=/home/runner \
            -e CARGO_HOME=/home/runner/.cargo \
            -e RUSTUP_HOME=/home/runner/.rustup \
            -w /repo/webui \
            --user "$(id -u):$(id -g)" \
            meta-hybrid_mount-ci:local \
            pnpm lint
      - name: Run test
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$PNPM_STORE_PATH:$PNPM_STORE_PATH" \
            -v "$HOME/.cargo:/home/runner/.cargo" \
            -v "$HOME/.rustup:/home/runner/.rustup" \
            -e PNPM_STORE_PATH="$PNPM_STORE_PATH" \
            -e HOME=/home/runner \
            -e CARGO_HOME=/home/runner/.cargo \
            -e RUSTUP_HOME=/home/runner/.rustup \
            -w /repo/webui \
            --user "$(id -u):$(id -g)" \
            meta-hybrid_mount-ci:local \
            pnpm test
